name: probe
on:
  push:
    branches: [ci/wp-shards]
jobs:
  probe:
    runs-on: ubuntu-24.04
    container: framac/frama-c:32.1
    steps:
      - run: |
          F=$(find / -name frama-c -type f -perm -u+x 2>/dev/null | head -1); echo "frama-c at $F"; B=$(dirname $F); export PATH=$B:$PATH
          ls $B | tr '\n' ' '; echo
          frama-c -version; why3 --version; alt-ergo --version || true; z3 --version || true; cvc5 --version | head -1 || true
          ls -la /home/opam/.why3.conf ~/.why3.conf 2>&1; why3 config list-provers 2>&1 | tail -8; nproc; which cmake gcc make python3 git unzip curl || true
